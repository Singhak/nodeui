name: Feature request
description: Propose a new panel, provider, or capability
title: '[feat]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What developer pain does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Which panels/endpoints would be affected?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options:
        - Core (provider / API)
        - Adapter (Express / NestJS)
        - UI (panel)
        - Docs
    validations:
      required: true
