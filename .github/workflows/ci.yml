name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The console bundle is committed (so git installs work); fail if it is stale.
      - if: matrix.node-version == 22
        run: git diff --exit-code -- packages/core/static
      - run: npm run coverage -w @singhak/nodeui-core

  express-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The peer range allows Express 4 and 5, and their router internals
      # differ. Pin the workspace to Express 4 without saving so the adapter
      # and routes provider are exercised against the older router shape.
      - run: npm install --no-save -w @singhak/nodeui-express express@4 @types/express@4
      - run: npm test -w @singhak/nodeui-express
      - run: npm run typecheck -w @singhak/nodeui-express

  fastify-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The peer range allows Fastify 4 and 5; exercise the older major too.
      - run: npm install --no-save -w @singhak/nodeui-fastify fastify@4
      - run: npm test -w @singhak/nodeui-fastify
      - run: npm run typecheck -w @singhak/nodeui-fastify
